<title>Sprint Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff;--soft:#f7f7f8;--ink:#0d0d0d;--muted:#6b6b72;--faint:#9a9aa2;--line:#ececf0;--lineStrong:#d9d9e0;
  --epic:#fdeef5;--epicInk:#a0205f;--epicLine:#f3c3d9;--story:#e9f6ee;--storyInk:#137333;--storyLine:#bfe3cb;--task:#e8f0fe;--taskInk:#1967d2;--taskLine:#c4d6fb;
  --blue:#1967d2;--green:#2e9e6b;--red:#c5221f;--amber:#b06000;--amberBg:#fdf3df;--redBg:#fce8e6;--greenBg:#e6f4ec;
  --shadow:0 10px 30px rgba(0,0,0,.14);--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416;--soft:#1d1d20;--ink:#f3f3f5;--muted:#a3a3ab;--faint:#7c7c85;--line:#2a2a2f;--lineStrong:#3a3a42;
  --epic:#3a2230;--epicInk:#f5b9d6;--epicLine:#5a3248;--story:#1f3326;--storyInk:#a8dab5;--storyLine:#2f4d39;--task:#1f2e46;--taskInk:#aecbfa;--taskLine:#2f4670;
  --blue:#8ab4f8;--green:#5cc796;--red:#f28b82;--amber:#fdd663;--amberBg:#3a3320;--redBg:#3d2423;--greenBg:#1f3326;--shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416;--soft:#1d1d20;--ink:#f3f3f5;--muted:#a3a3ab;--faint:#7c7c85;--line:#2a2a2f;--lineStrong:#3a3a42;
  --epic:#3a2230;--epicInk:#f5b9d6;--epicLine:#5a3248;--story:#1f3326;--storyInk:#a8dab5;--storyLine:#2f4d39;--task:#1f2e46;--taskInk:#aecbfa;--taskLine:#2f4670;
  --blue:#8ab4f8;--green:#5cc796;--red:#f28b82;--amber:#fdd663;--amberBg:#3a3320;--redBg:#3d2423;--greenBg:#1f3326;--shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:1320px;margin:0 auto}.wrap>*{min-width:0}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}
.tabs{display:flex;gap:2px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow-x:auto;max-width:100%}
.tab{font:500 14px var(--sans);border:0;background:transparent;color:var(--muted);padding:9px 18px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tab:hover:not([aria-selected=true]){color:var(--ink)}
.rfcard{display:flex;align-items:center;gap:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 16px;min-height:52px}
.rfcard .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.rfcard .dot.old{background:var(--amber)}.rfcard .dot.busy{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.fl{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.rfv{font-size:14px;font-weight:600;line-height:1.25}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn:hover{opacity:.9}.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;flex:none}.btn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.rfmsg{font-size:12px;color:var(--muted);margin:-10px 0 14px;text-align:right}
.rfmsg.err{color:var(--red)}
.rfprog{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:-10px 0 14px;font-size:12px;color:var(--muted)}
.rfprog .bar{width:min(320px,100%);height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.rfprog .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s linear}
.rfprog b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
/* toolbar and fields */
.bar{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end;margin-bottom:18px}
.field{display:block}.field[hidden]{display:none}
.field>.fl{margin-bottom:6px;font-size:12px}
.ctl{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:220px;height:40px;padding:0 12px;border:1px solid var(--lineStrong);background:var(--bg);color:var(--ink);border-radius:9px;font:500 14px var(--sans);cursor:pointer}
.ctl:hover{border-color:var(--faint)}
input.ctl{cursor:text;min-width:240px}
.dd{position:relative}
.ddpop{position:absolute;left:0;top:calc(100% + 6px);z-index:15;background:var(--bg);border:1px solid var(--lineStrong);border-radius:12px;box-shadow:var(--shadow);padding:10px;width:280px}
.ddpop[hidden]{display:none}
.ddsearch{width:100%;height:36px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:0 10px;font:14px var(--sans);margin-bottom:8px}
.ddlist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}
.ddopt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.ddopt:hover{background:var(--soft)}.ddopt input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.ddact{display:flex;gap:14px;font-size:12px;padding:8px 4px 0;border-top:1px solid var(--line);margin-top:6px}
.ddact button{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;font:500 12px var(--sans)}
.ddnone{color:var(--faint);padding:8px 10px;font-size:13px}
/* map */
.legend{display:flex;flex-wrap:wrap;gap:18px;color:var(--muted);font-size:12px;margin:0 0 18px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.mapwrap{position:relative;overflow-x:auto;padding-bottom:12px}
.map{position:relative;display:grid;grid-template-columns:240px repeat(var(--n,3),minmax(220px,280px));column-gap:var(--gap,72px);row-gap:24px;justify-content:start;align-items:start;width:max-content;max-width:none}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map path{fill:none;stroke:var(--lineStrong);stroke-width:1.5;transition:stroke .15s,stroke-width .15s}
.map path.hl{stroke:var(--epicInk);stroke-width:2.4}
.colh{font-weight:600;font-size:14px}
.cell{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.card{position:relative;z-index:1;text-align:left;font:inherit;border:1px solid;border-radius:14px;padding:14px 16px;cursor:pointer;width:100%;transition:transform .15s ease,box-shadow .15s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow)}
.card.epic{background:var(--epic);border-color:var(--epicLine);color:var(--epicInk)}
.card.story{background:var(--story);border-color:var(--storyLine);color:var(--storyInk)}
.card .k{font-size:12px;opacity:.8;font-weight:500}
.card .t{font-weight:600;font-size:14px;line-height:1.35;margin:4px 0 10px;overflow-wrap:anywhere}
.card .m{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.av{width:18px;height:18px;border-radius:50%;background:rgba(127,127,127,.22);display:inline-grid;place-items:center;font-size:9px;font-weight:700}
.pill.n{margin-left:auto;font-weight:600}
.empty{color:var(--faint);font-size:13px;padding:12px 0}
.mlist{display:none}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:30;transform:translateX(105%);transition:transform .25s ease;overflow-y:auto;padding:26px 26px 60px;padding-right:max(26px,env(safe-area-inset-right,0px))}
.drawer.on{transform:none}
.drawer .x{position:sticky;top:0;float:right;font:500 13px var(--sans);border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--blue);cursor:pointer;font:inherit;padding:0}.crumb button:hover{text-decoration:underline}
.kind{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:10px}
.kind.epic{background:var(--epic);color:var(--epicInk)}.kind.story{background:var(--story);color:var(--storyInk)}.kind.task{background:var(--task);color:var(--taskInk)}
.drawer h2{font:600 22px/1.25 var(--sans);margin:0 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
.drawer a.link{color:var(--blue)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--soft);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:18px;font-weight:600}.fact span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec{margin-top:22px}.lb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px}
.desc p{margin:0 0 10px}.desc ul{margin:0 0 10px;padding-left:20px}.desc li{margin:2px 0}.nodesc{color:var(--faint)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;font:inherit;border:1px solid;border-radius:12px;padding:10px 12px;cursor:pointer;width:100%;transition:transform .12s,box-shadow .12s}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.item.story{background:var(--story);border-color:var(--storyLine);color:var(--storyInk)}.item.task{background:var(--task);border-color:var(--taskLine);color:var(--taskInk)}
.item .k{font-size:12px;font-weight:600}.item .t{font-weight:500;overflow-wrap:anywhere}.item .h{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .s{grid-column:2/4;font-size:12px;opacity:.8}
/* shared blocks */
.panel{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{margin:0 0 12px;font:600 15px var(--sans)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--lineStrong);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}
tr.tot td{font-weight:700}
.tl td:nth-child(n+2),.tl th:nth-child(n+2){text-align:left}
.scroll{overflow-x:auto}
td.ok{color:var(--green);font-weight:600}td.warn{color:var(--amber);font-weight:600}td.bad{color:var(--red);font-weight:600}
.tag{display:inline-block;font:600 12px var(--sans);padding:3px 10px;border-radius:999px}
.tag.ok{background:var(--greenBg);color:var(--green)}.tag.warn{background:var(--amberBg);color:var(--amber)}.tag.bad{background:var(--redBg);color:var(--red)}.tag.nil{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.key{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px}.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
/* capacity */
.capgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.chart{width:100%;height:auto;display:block}
/* burndown */
.info{margin-bottom:18px}.info th,.info td{text-align:left!important;padding:10px 14px}.info td{font-weight:500;font-size:14px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin:16px 0 18px}
.brow{display:grid;grid-template-columns:84px 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.btrack{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bfill{height:100%;border-radius:6px;background:var(--blue)}
.bfill.grey{background:var(--faint)}.bfill.ok{background:var(--green)}.bfill.warn{background:var(--amber)}.bfill.bad{background:var(--red)}
.bval{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}.cardhead h3{margin:0}
.cardhead select{height:32px;border:1px solid var(--lineStrong);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 8px;font:13px var(--sans)}
/* pull log */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}.stat small{color:var(--muted);font-size:12px}
.sched{display:grid;grid-template-columns:130px repeat(2,minmax(120px,1fr));gap:8px;max-width:520px}
.sched .h{font-size:12px;font-weight:600;color:var(--muted);padding:0 4px}
.sched .d{font-size:13px;padding:10px 4px;font-weight:500}.sched .d.today{color:var(--blue);font-weight:700}
.slot{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid transparent}
.slot i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.slot.ok{background:var(--greenBg);color:var(--green)}.slot.bad{background:var(--redBg);color:var(--red)}.slot.warn{background:var(--amberBg);color:var(--amber)}
.slot.up{background:transparent;color:var(--muted);border:1px dashed var(--lineStrong)}.slot.na{color:var(--faint);padding-left:12px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.stack span{display:block;height:100%}
.sprow{display:grid;grid-template-columns:90px 1fr 120px;gap:12px;align-items:center;margin:10px 0;font-size:13px}
.cal{display:grid;grid-template-columns:72px repeat(14,minmax(46px,1fr));gap:8px 6px;align-items:center;min-width:760px}
.cd{font-size:12px;font-weight:600;color:var(--muted);text-align:center}.cd.today{color:var(--blue)}
.cl{font-size:13px;font-weight:600}.cc{display:flex;justify-content:center}
.dotc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:1.5px solid transparent}
.dotc.ok{background:var(--green);color:#fff}.dotc.bad{background:var(--red);color:#fff}.dotc.warn{background:var(--amber);color:#fff}.dotc.up{border:1.5px dashed var(--faint)}.dotc.na{background:var(--line)}
/* stakeholders */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.role{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:22px}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.rnum{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff}
.role h3{margin:0;font:600 18px var(--sans)}
.role ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.role li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:14px;line-height:1.5}
.role li svg{width:18px;height:18px;margin-top:2px}
.pgtitle{font:600 20px var(--sans);margin:0 0 4px}.pgsub{color:var(--muted);margin:0 0 18px;font-size:14px}
@media (max-width:1100px){.capgrid{grid-template-columns:1fr}}
@media (max-width:860px){
  .mapwrap{overflow:visible}.map{display:none}.mlist{display:block}
  .mlist .ep{margin:0 0 30px}.mlist .ep>.card{margin-bottom:12px}
  .mlist .sp{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 8px}.mlist .cell{margin-left:14px}
  .rfcard{width:100%}.ctl,input.ctl{min-width:0;width:100%}.field,.dd{width:100%}.ddpop{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card:hover{transform:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="map" aria-selected="true">Map</button>
      <button class="tab" role="tab" data-tab="cap" aria-selected="false">Capacity</button>
      <button class="tab" role="tab" data-tab="bd" aria-selected="false">Burndown</button>
      <button class="tab" role="tab" data-tab="log" aria-selected="false">Pull log</button>
      <button class="tab" role="tab" data-tab="who" aria-selected="false">Stakeholders</button>
    </div>
    <div class="rfcard" aria-live="polite">
      <span class="dot" id="rfdot"></span>
      <div><span class="fl">Last refreshed</span><div class="rfv" id="rfval">Loading</div></div>
      <button class="btn" id="rfbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg><span id="rfbtxt">Refresh</span></button>
    </div>
  </div>
  <div class="rfmsg" id="rfmsg" hidden aria-live="polite"></div>
  <div class="rfprog" id="rfprog" hidden><div id="rfptxt" aria-live="polite"></div><div class="bar" id="rfpbarwrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="rfpbar"></i></div></div>
  <div class="bar" id="bar">
    <div class="field" id="fsprint"><span class="fl">Sprint</span>
      <div class="dd"><button class="ctl" id="ddbtn" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="ddlab">Sprint</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4.5 6 8l4-3.5"/></svg></button>
        <div class="ddpop" id="ddpop" hidden><input class="ddsearch" id="ddsearch" placeholder="Search sprint" autocomplete="off"><div class="ddlist" id="ddlist"></div><div class="ddact" id="ddact"><button type="button" data-q="all">Select all</button><button type="button" data-q="none">Clear</button></div></div></div></div>
    <div class="field" id="fasof" hidden><span class="fl">As of (IST)</span><input class="ctl" type="datetime-local" id="asof"></div>
  </div>
  <section id="v-map"><div class="legend"><span><i style="background:var(--epicInk)"></i>Epic</span><span><i style="background:var(--storyInk)"></i>User story</span><span><i style="background:var(--taskInk)"></i>Task, opens inside a user story</span></div>
    <div class="mapwrap"><div class="map" id="map"></div><div class="mlist" id="mlist"></div></div></section>
  <section id="v-cap" hidden></section>
  <section id="v-bd" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-who" hidden></section>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite" aria-label="Details"></aside>

<script>
let D = /*DATA*/{sprints:[],epics:[],stories:[],desc:{}};
let BD = /*BD*/{}, META = /*META*/null, RUNS = /*RUNS*/[];
const REFRESH_URL = 'https://sprint-dashboard-umber.vercel.app/api/refresh';   // address of the refresh relay (relay/worker.js); it holds the GitHub token, the page holds none
const SHOW = ['S20', 'S21', 'S22', 'S23', 'S24'];          // sprints offered in the dashboard
const CAP = 64, WH0 = 11, DH = 8, SCHED_START = '2026-11-13', SLOTS = [[10, 45], [18, 45]];
const TEAM = ['Nikita', 'Sumit', 'Aditi', 'Abhishek', 'Rushikesh', 'Chetan', 'Nitin', 'Rujin'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const J = k => 'https://canaryai.atlassian.net/browse/' + k;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = v => (Math.round(v * 10) / 10).toString();
const sg = d => d > 0.05 ? '+' + f1(d) : d < -0.05 ? '−' + f1(-d) : '0';

/* ---------- pull log: scheduled runs only ---------- */
const slotMs = (d, h, m) => Date.parse(`${d}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00+05:30`);

function renderLog() {
  const runs = (RUNS || []).filter(r => r.trigger === 'schedule').map(r => Object.assign({ ms: Date.parse(r.at) }, r)).sort((a, b) => a.ms - b.ms), now = Date.now(), used = new Set();

    if (run) { used.add(run); return { c: run.ok ? 'ok' : 'bad', t: run.ok ? 'Pulled' : 'Failed', run }; }
    return t + 180 * 60e3 < now ? { c: 'warn', t: 'Missed' } : { c: 'up', t: 'Upcoming' }; };

  for (let i = 0; i < 14; i++) { const d = dStr(dUTC(start) + i * 864e5); grid.push({ d, s: SLOTS.map(sl => state(d, sl)) }); }

  const cur = labelOf(today), rows = Object.keys(perSp).map(Number).filter(n => n === cur || perSp[n].done || perSp[n].fail).sort((a, b) => b - a);
  const inM = ms => { const m = Math.round((ms - now) / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
  $('#v-log').innerHTML = `<div class="stats">
      <div class="stat"><span class="fl">Schedule</span><b>10:45 AM and 6:45 PM</b><small>IST, every day, runs on its own</small></div>
      <div class="stat"><span class="fl">Next scheduled pull</span><b>${next ? esc(tfmt(next)) : '–'}</b><small>${next ? 'in ' + inM(next) : ''}</small></div>
      <div class="stat"><span class="fl">Last scheduled pull</span><b>${lastOk ? esc(tfmt(lastOk.ms)) : 'Not yet run'}</b><small>${lastOk ? lastOk.issues + ' issues pulled' : 'The first one runs at 10:45 AM IST on 13 Nov'}</small></div></div>
    <div class="panel" style="margin-bottom:18px"><div class="cardhead"><h3>Schedule, next 14 days</h3><div class="key"><span><i style="background:var(--green);border-radius:50%"></i>Pulled</span><span><i style="background:var(--red);border-radius:50%"></i>Failed</span><span><i style="background:var(--amber);border-radius:50%"></i>Missed</span><span><i style="border:1.5px dashed var(--faint);background:none;border-radius:50%"></i>Upcoming</span></div></div>
      <div class="scroll"><div class="cal"><span></span>${grid.map(g => `<div class="cd ${g.d === today ? 'today' : ''}">${esc(fmtD(g.d))}</div>`).join('')}
      ${SLOTS.map((sl, si) => `<div class="cl">${si ? '6:45 PM' : '10:45 AM'}</div>${grid.map(g => { const x = g.s[si]; return `<div class="cc"><span class="dotc ${x.c}" title="${esc(fmtD(g.d) + ' ' + (si ? '6:45 PM' : '10:45 AM') + ': ' + (x.t || 'Before the schedule started'))}">${x.c === 'ok' ? '\u2713' : x.c === 'bad' ? '!' : x.c === 'warn' ? '\u2013' : ''}</span></div>`; }).join('')}`).join('')}</div></div></div>
    <div class="panel"><h3>Scheduled pulls per sprint</h3>${rows.length ? rows.map(n => { const p = perSp[n], rest = p.plan - p.done - p.fail - p.miss, pc = v => v / p.plan * 100;
      return `<div class="sprow"><b>Sprint ${n}</b><div class="stack"><span style="width:${pc(p.done)}%;background:var(--green)"></span><span style="width:${pc(p.fail)}%;background:var(--red)"></span><span style="width:${pc(p.miss)}%;background:var(--amber)"></span></div><span><b>${p.done}</b> of ${p.plan} planned</span></div>`; }).join('') : '<div class="empty">No scheduled pulls yet.</div>'}
      <p class="empty" style="margin-top:14px">Manual refreshes are not counted here.</p></div>`;
}

/* ---------- stakeholders ---------- */
const ROLES = [['Developers', '#1967d2', ['Whatever estimate is given in Sprint Planning is completed by the end of the sprint', 'Original estimates are not changed once given to the PM', 'Time is logged daily, before the evening Daily Scrum call', 'A document with the technical approach (a file or an artifact link) is added to the ticket before development starts']],
  ['QA', '#2e9e6b', ['Test cases are prepared from the user story while development is in progress', 'Bugs are logged under the product tracker story with a P0 to P4 priority in the title', 'A task moves to UAT only after QA sign-off; demos need BVTs passing']],
  ['PM', '#a0205f', ['The sprint is locked on day 2, after day 1 is spent creating epics and user stories in Jira', "On day 2, last sprint's retrospective report goes to the CTO", 'Every ticket has an estimate and a due date before the sprint is locked', 'Work added mid-sprint is recorded in Jira with a reason']],
  ['CTO', '#b06000', ['Reviews the technical document and approach for each task with the developers, before they formally start development', 'Attends the internal demos and accepts the result when BVTs pass', "Heads all engineering activities and the developers' work"]]];
const TICK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8.5" opacity=".35"/><path d="m6.5 10.3 2.3 2.3 4.7-5"/></svg>';
function renderWho() {
  $('#v-who').innerHTML = `<h2 class="pgtitle">Stakeholders and rules</h2><p class="pgsub">Four stakeholders run the sprint. Each one agrees to the rules below.</p><div class="roles">${ROLES.map((r, i) => `<div class="role"><div class="rhead"><span class="rnum" style="background:${r[1]}">${i + 1}</span><h3>${r[0]}</h3></div><ul>${r[2].map(x => `<li><span style="color:${r[1]}">${TICK}</span><span>${esc(x)}</span></li>`).join('')}</ul></div>`).join('')}</div>`;
}

/* ---------- drawer ---------- */
const dr = $('#drawer'), scrim = $('#scrim');
const crumbs = () => '<div class="crumb">' + stack.map((k, i) => (i ? '<span>/</span>' : '') + (i < stack.length - 1 ? `<button data-go="${i}">${esc(k)}</button>` : `<span>${esc(k)}</span>`)).join('') + '</div>';
const descBlock = k => { const t = D.desc[k]; return `<div class="sec"><div class="lb">Description</div><div class="desc">${t ? md(t) : '<span class="nodesc">No description in Jira.</span>'}</div></div>`; };
function openItem(kind, key) {
  stack = stack.slice(); if (stack[stack.length - 1] !== key) stack.push(key);
  const o = kind === 'e' ? E[key] : kind === 's' ? S[key] : T[key]; let h = '<button class="x" data-close>Close</button>' + crumbs();
  if (kind === 'e') {
    const ss = D.stories.filter(s => s.epic === key && SHOW.includes(s.sprint)).sort((a, b) => IDX[a.sprint] - IDX[b.sprint]), hh = ss.reduce((a, s) => a + hrs(s), 0), pp = ss.reduce((a, s) => a + (s.sp || 0), 0);
    h += `<span class="kind epic">Epic</span><h2>${esc(o.title)}</h2><a class="link" target="_blank" rel="noopener" href="${J(key)}">${esc(key)} in Jira</a>
      <div class="facts"><div class="fact"><b>${esc(o.a || 'Unassigned')}</b><span>Assignee</span></div><div class="fact"><b>${ss.length}</b><span>User stories</span></div><div class="fact"><b>${f1(hh)} h</b><span>Original estimate</span></div>${pp ? `<div class="fact"><b>${pp}</b><span>Story points</span></div>` : ''}</div>
      ${descBlock(key)}<div class="sec"><div class="lb">User stories (${ss.length})</div><div class="list">${ss.map(s => `<button class="item story" data-s="${esc(s.key)}"><span class="k">${esc(s.key)}</span><span class="t">${esc(s.title)}</span><span class="h">${f1(hrs(s))} h${s.sp != null ? ' · ' + pts(s) : ''}</span><span class="s">${esc(spName(s.sprint))} · ${esc(s.a)}</span></button>`).join('')}</div></div>`;
  } else if (kind === 's') {
    h += `<span class="kind story">User story</span><h2>${esc(o.title)}</h2><a class="link" target="_blank" rel="noopener" href="${J(key)}">${esc(key)} in Jira</a>
      <div class="facts"><div class="fact"><b>${esc(o.a || 'Unassigned')}</b><span>Assignee</span></div><div class="fact"><b>${esc(spName(o.sprint))}</b><span>Sprint</span></div><div class="fact"><b>${f1(hrs(o))} h</b><span>Original estimate</span></div>${o.sp != null ? `<div class="fact"><b>${o.sp}</b><span>Story points</span></div>` : ''}</div>
      ${descBlock(key)}<div class="sec"><div class="lb">Tasks (${o.tasks.length})</div>${o.tasks.length ? `<div class="list">${o.tasks.map(t => `<button class="item task" data-t="${esc(t.key)}"><span class="k">${esc(t.key)}</span><span class="t">${esc(t.t)}</span><span class="h">${f1(t.h || 0)} h</span><span class="s">${esc(t.a)} · ${esc(t.s)}</span></button>`).join('')}</div>` : '<span class="nodesc">No tasks under this user story.</span>'}</div>`;
  } else {
    h += `<span class="kind task">Task</span><h2>${esc(o.t)}</h2><a class="link" target="_blank" rel="noopener" href="${J(key)}">${esc(key)} in Jira</a>
      <div class="facts"><div class="fact"><b>${esc(o.a || 'Unassigned')}</b><span>Assignee</span></div><div class="fact"><b>${f1(o.h || 0)} h</b><span>Original estimate</span></div><div class="fact"><b>${esc(o.s || '–')}</b><span>Status</span></div></div>${descBlock(key)}`;
  }
  dr.innerHTML = h; dr.classList.add('on'); scrim.classList.add('on'); dr.scrollTop = 0;
}
const closeD = () => { dr.classList.remove('on'); scrim.classList.remove('on'); stack = []; };
dr.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeD();
  const g = e.target.closest('[data-go]'); if (g) { const i = +g.dataset.go, k = stack[i]; stack = stack.slice(0, i); return openItem(E[k] ? 'e' : S[k] ? 's' : 't', k); }
  const s = e.target.closest('[data-s]'); if (s) return openItem('s', s.dataset.s);
  const t = e.target.closest('[data-t]'); if (t) return openItem('t', t.dataset.t);
});
scrim.onclick = closeD; document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeD(); ddpop.hidden = true; } });
$('#v-map').addEventListener('click', e => { const c = e.target.closest('[data-e],[data-s]'); if (!c) return; stack = []; c.dataset.e ? openItem('e', c.dataset.e) : openItem('s', c.dataset.s); });
$('#map').addEventListener('mouseover', e => { const c = e.target.closest('[data-s]'); document.querySelectorAll('#lines path').forEach(p => p.classList.toggle('hl', !!c && p.dataset.a === c.dataset.s)); });
$('#map').addEventListener('mouseleave', () => document.querySelectorAll('#lines path.hl').forEach(p => p.classList.remove('hl')));

/* ---------- tabs ---------- */
function show() {
  document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  ['map', 'cap', 'bd', 'log', 'who'].forEach(t => $('#v-' + t).hidden = t !== tab);
  $('#fsprint').hidden = !['map', 'cap', 'bd'].includes(tab); $('#fasof').hidden = tab !== 'bd'; $('#bar').style.display = ['map', 'cap', 'bd'].includes(tab) ? '' : 'none';
  ddLabel();
  ({ map: renderMap, cap: renderCap, bd: renderBd, log: renderLog, who: renderWho })[tab]();
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; closeD(); show(); } });
window.addEventListener('resize', () => { if (tab === 'map') lines(); });

/* ---------- refresh ---------- */
const rfb = $('#rfbtn'), rfm = $('#rfmsg');
const ago = ms => { const m = Math.round(ms / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
function showMeta() {
  if (!META) { $('#rfval').textContent = 'Unknown'; return; }
  const t = Date.parse(META.refreshedAt), age = Date.now() - t;
  $('#rfval').textContent = tfmt(t); $('#rfval').title = ago(age); $('#rfdot').className = 'dot' + (age > 14 * 3600e3 ? ' old' : '');
}
function msg(t, err) { rfm.hidden = !t; rfm.textContent = t || ''; rfm.className = 'rfmsg' + (err ? ' err' : ''); }
async function loadData() {
  const q = '?v=' + Date.now(), g = async f => { const r = await fetch('data/' + f + q, { cache: 'no-store' }); if (!r.ok) throw new Error(f); return r.json(); };
  [D, BD, META, RUNS] = await Promise.all([g('map.json'), g('burndown.json'), g('meta.json'), g('runs.json')]); ingest(); selMap = selMap.filter(i => SHOW.includes(i)); closeD(); show(); showMeta();
}
const EXPECT = 45;   // seconds a refresh normally takes (measured about 40)
async function startRefresh() {
  if (!REFRESH_URL) return msg('Refresh is not switched on yet. The admin needs to finish the one-time setup.', true);
  const before = META && META.refreshedAt, prog = $('#rfprog'), ptxt = $('#rfptxt'), pbar = $('#rfpbar'), pwrap = $('#rfpbarwrap');
  rfb.disabled = true; rfb.classList.add('spin'); $('#rfbtxt').textContent = 'Refreshing'; $('#rfdot').className = 'dot busy'; msg('');
  const t0 = Date.now(); let tick = null;
  const paint = () => {
    const s = (Date.now() - t0) / 1000, left = Math.ceil(EXPECT - s), pct = Math.min(95, s / EXPECT * 95);
    pbar.style.width = pct + '%'; pwrap.setAttribute('aria-valuenow', Math.round(pct));
    ptxt.innerHTML = left > 0 ? 'Fetching the latest data from Jira. About <b>' + left + ' s</b> left.' : 'Taking a little longer than usual. <b>' + Math.floor(s) + ' s</b> elapsed.';
  };
  const end = () => { clearInterval(tick); prog.hidden = true; pbar.style.width = '0'; };
  const done = (m, err) => { end(); rfb.disabled = false; rfb.classList.remove('spin'); $('#rfbtxt').textContent = 'Refresh'; showMeta(); msg(m, err); if (m) setTimeout(() => { if (rfm.textContent === m) msg(''); }, 8000); };
  prog.hidden = false; paint(); tick = setInterval(paint, 500);
  try { const r = await fetch(REFRESH_URL, { method: 'POST' }); if (!r.ok) throw new Error('relay answered ' + r.status); }
  catch (e) { return done('Could not start the refresh (' + e.message + '). Try again in a minute.', true); }
  for (let i = 0; i < 100; i++) {
    await new Promise(r => setTimeout(r, 3000));
    try { const m = await (await fetch('data/meta.json?v=' + Date.now(), { cache: 'no-store' })).json(); if (m.refreshedAt !== before) { pbar.style.width = '100%'; await loadData(); return done('Data updated.'); } } catch (e) {}
  }
  done('The refresh is taking longer than expected. Reload in a few minutes.', true);
}
rfb.onclick = startRefresh;
setInterval(() => { if (META) showMeta(); if (tab === 'log') renderLog(); }, 60000);
showMeta(); show();
if (!D.stories.length) loadData().catch(() => { $('#rfval').textContent = 'Could not load data'; });
</script>
