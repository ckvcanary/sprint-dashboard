name: Refresh Jira data

on:
  schedule:                  # GitHub does not promise the exact minute, and sometimes drops a run, so each slot is tried three times;
    - cron: "15 5 * * 1-5"   #   10:45 AM IST, Monday to Friday
    - cron: "45 5 * * 1-5"   #   retry at 11:15 AM IST (skipped when the 10:45 pull already worked)
    - cron: "15 6 * * 1-5"   #   retry at 11:45 AM IST
    - cron: "15 13 * * 1-5"  #   6:45 PM IST, Monday to Friday
    - cron: "45 13 * * 1-5"  #   retry at 7:15 PM IST
    - cron: "15 14 * * 1-5"  #   retry at 7:45 PM IST
  workflow_dispatch:         # manual refresh, started from the dashboard or the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull from Jira
        id: pull
        env:
          JIRA_BASE: ${{ secrets.JIRA_BASE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 scripts/refresh.py
      - name: Save data and the pull log
        if: always()
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"; sleep 5
          done
          echo "Could not save the data to GitHub after 3 attempts"; exit 1
      - name: Build site
        if: always()
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
