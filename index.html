<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>Sprint Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff;--soft:#f7f7f8;--ink:#0d0d0d;--muted:#6b6b72;--faint:#9a9aa2;--line:#ececf0;--lineStrong:#d9d9e0;
  --epic:#fdeef5;--epicInk:#a0205f;--epicLine:#f3c3d9;--story:#e9f6ee;--storyInk:#137333;--storyLine:#bfe3cb;--task:#e8f0fe;--taskInk:#1967d2;--taskLine:#c4d6fb;
  --blue:#1967d2;--green:#2e9e6b;--red:#c5221f;--amber:#b06000;--shadow:0 10px 30px rgba(0,0,0,.14);--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416;--soft:#1d1d20;--ink:#f3f3f5;--muted:#a3a3ab;--faint:#7c7c85;--line:#2a2a2f;--lineStrong:#3a3a42;
  --epic:#3a2230;--epicInk:#f5b9d6;--epicLine:#5a3248;--story:#1f3326;--storyInk:#a8dab5;--storyLine:#2f4d39;--task:#1f2e46;--taskInk:#aecbfa;--taskLine:#2f4670;
  --blue:#8ab4f8;--green:#5cc796;--red:#f28b82;--amber:#fdd663;--shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416;--soft:#1d1d20;--ink:#f3f3f5;--muted:#a3a3ab;--faint:#7c7c85;--line:#2a2a2f;--lineStrong:#3a3a42;
  --epic:#3a2230;--epicInk:#f5b9d6;--epicLine:#5a3248;--story:#1f3326;--storyInk:#a8dab5;--storyLine:#2f4d39;--task:#1f2e46;--taskInk:#aecbfa;--taskLine:#2f4670;
  --blue:#8ab4f8;--green:#5cc796;--red:#f28b82;--amber:#fdd663;--shadow:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 72px}
.wrap{max-width:1280px;margin:0 auto}
.wrap>*{min-width:0}
h1{font:600 30px/1.15 var(--sans);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 22px;max-width:70ch}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabs{display:flex;gap:4px}
.tab{font:500 14px var(--sans);border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected=true]){background:var(--soft)}
.sel{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:18px;color:var(--muted);font-size:12px;margin-bottom:22px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.mapwrap{position:relative;overflow-x:auto;padding-bottom:12px}
.map{position:relative;display:grid;grid-template-columns:230px repeat(var(--n,4),minmax(220px,1fr));column-gap:28px;row-gap:26px;min-width:calc(230px + var(--n,4) * 248px);align-items:start}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map path{fill:none;stroke:var(--lineStrong);stroke-width:1.4;transition:stroke .15s,stroke-width .15s}
.map path.hl{stroke:var(--epicInk);stroke-width:2.4}
.colh{font-weight:600;font-size:13px}.colh small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.colh.now{color:var(--storyInk)}
.cell{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.card{position:relative;z-index:1;text-align:left;font:inherit;border:1px solid;border-radius:14px;padding:14px 16px;cursor:pointer;width:100%;
  transition:transform .15s ease,box-shadow .15s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow)}
.card.epic{background:var(--epic);border-color:var(--epicLine);color:var(--epicInk)}
.card.story{background:var(--story);border-color:var(--storyLine);color:var(--storyInk)}
.card .k{font-size:12px;opacity:.8;font-weight:500}
.card .t{font-weight:600;font-size:14px;line-height:1.35;margin:4px 0 10px;overflow-wrap:anywhere}
.card .m{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.av{width:18px;height:18px;border-radius:50%;background:rgba(127,127,127,.22);display:inline-grid;place-items:center;font-size:9px;font-weight:700}
.pill.n{margin-left:auto;font-weight:600}
.empty{color:var(--faint);font-size:12px;padding-top:6px}
.rowlab{font-size:12px;color:var(--muted);margin-top:4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:30;
  transform:translateX(105%);transition:transform .25s ease;overflow-y:auto;padding:26px 26px 60px;padding-right:max(26px,env(safe-area-inset-right,0px))}
.drawer.on{transform:none}
.drawer .x{position:sticky;top:0;float:right;font:500 13px var(--sans);border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--blue);cursor:pointer;font:inherit;padding:0}
.crumb button:hover{text-decoration:underline}
.kind{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:10px}
.kind.epic{background:var(--epic);color:var(--epicInk)}.kind.story{background:var(--story);color:var(--storyInk)}.kind.task{background:var(--task);color:var(--taskInk)}
.drawer h2{font:600 22px/1.25 var(--sans);margin:0 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
.drawer a.link{color:var(--blue)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--soft);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:18px;font-weight:600}.fact span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec{margin-top:22px}.lb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px}
.desc p{margin:0 0 10px}.desc ul{margin:0 0 10px;padding-left:20px}.desc li{margin:2px 0}
.nodesc{color:var(--faint)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;font:inherit;border:1px solid;border-radius:12px;padding:10px 12px;cursor:pointer;width:100%;transition:transform .12s,box-shadow .12s}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.item.story{background:var(--story);border-color:var(--storyLine);color:var(--storyInk)}
.item.task{background:var(--task);border-color:var(--taskLine);color:var(--taskInk)}
.item .k{font-size:12px;font-weight:600}.item .t{font-weight:500;overflow-wrap:anywhere}.item .h{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .s{grid-column:2/4;font-size:12px;opacity:.8}
/* capacity */
.card2{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px}
.capgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.chart{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--lineStrong)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}
tr.tot td{font-weight:700}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:12px}
.mlist{display:none}
.mspop[hidden]{display:none}
.msel{position:relative}
.msbtn{font:500 13px var(--sans);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.msbtn:after{content:"  \25BE"}
.mspop{position:absolute;right:0;top:calc(100% + 6px);z-index:15;background:var(--bg);border:1px solid var(--lineStrong);border-radius:12px;box-shadow:var(--shadow);padding:10px;min-width:230px;display:flex;flex-direction:column;gap:2px}
.mspop label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.mspop label:hover{background:var(--soft)}
.mspop input{width:16px;height:16px;accent-color:var(--ink)}
.mspop .q{display:flex;gap:6px;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--sans);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.capfull{margin-top:6px}
.capfull .chart{width:100%;height:auto;max-height:68vh}
.capfull table{margin-top:18px;font-size:14px}
.capfull th,.capfull td{white-space:nowrap}
.capfull th{padding:8px 12px}.capfull td{padding:11px 12px}
@media (max-width:860px){
  .mapwrap{overflow:visible}.map{display:none}.mlist{display:block}
  .mlist .ep{margin:0 0 30px}.mlist .ep>.card{margin-bottom:12px}
  .mlist .sp{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 8px}
  .mlist .cell{margin-left:14px}
  .capgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}

.bdbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-bottom:10px}
.bdbar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.bdbar input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.bdinfo{color:var(--muted);font-size:13px;margin:0 0 16px}
.bdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;margin-bottom:22px}
.bdc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft);min-width:0}
.bdc h3{margin:0 0 2px;font:600 15px var(--sans);display:flex;justify-content:space-between;gap:8px;align-items:center}
.bdc .flag{font:600 12px var(--sans);padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.bdc .ok{color:var(--green)}.bdc .warn{color:var(--amber)}.bdc .bad{color:var(--red)}
.bdc .line{color:var(--muted);font-size:12px;margin:0 0 6px}
.bdc svg{width:100%;height:auto;display:block}
.bdt td.ok{color:var(--green);font-weight:600}.bdt td.warn{color:var(--amber);font-weight:600}.bdt td.bad{color:var(--red);font-weight:600}
.bdt th,.bdt td{white-space:nowrap;padding:10px 12px}
.rf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rfpanel{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:var(--muted);max-width:760px}
.rfpanel input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:min(100%,420px)}
.rfpanel a{color:var(--blue)}.rfpanel p{margin:0 0 8px}
.rf .chip[disabled]{opacity:.6;cursor:default}
</style>

<div class="wrap">
  <div class="top">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-map" aria-selected="true">Map</button>
      <button class="tab" role="tab" id="t-cap" aria-selected="false">Capacity</button>
      <button class="tab" role="tab" id="t-bd" aria-selected="false">Burndown</button>
      <button class="tab" role="tab" id="t-log" aria-selected="false">Pull log</button>
    </div>
    <div class="rf"><span id="rfstat" class="note"></span><button class="chip" id="rfbtn">Refresh data</button></div>
    <div class="msel"><button class="msbtn" id="msbtn" aria-haspopup="true" aria-expanded="false">Sprints</button><div class="mspop" id="mspop" hidden></div></div>
  </div>
  <div id="rfpanel" class="rfpanel" hidden></div>
  <section id="v-map">
    <div class="legend"><span><i style="background:var(--epicInk)"></i>Epic</span><span><i style="background:var(--storyInk)"></i>User story</span><span><i style="background:var(--taskInk)"></i>Task, opens inside a user story</span></div>
    <div class="mapwrap"><div class="map" id="map"></div><div class="mlist" id="mlist"></div></div>
  </section>
  <section id="v-cap" hidden></section>
  <section id="v-bd" hidden></section>
  <section id="v-log" hidden></section>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite" aria-label="Details"></aside>

<script>
let D = /*DATA*/{sprints:[],epics:[],stories:[],desc:{}};
let BD = /*BD*/{}, META = /*META*/null, RUNS = /*RUNS*/[];
const TEAM = ['Nikita','Sumit','Aditi','Abhishek','Rushikesh','Chetan','Nitin','Rujin'];
const J = k => 'https://canaryai.atlassian.net/browse/' + k;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = v => (Math.round(v * 10) / 10).toString();
const ini = n => n && n !== 'Unassigned' ? n.slice(0, 2).toUpperCase() : '–';
let SP = [], IDX = {}, E = {}, S = {}, T = {};
function ingest() {
  SP = D.sprints; IDX = {}; SP.forEach((s, i) => IDX[s.id] = i);
  E = {}; S = {}; T = {}; D.epics.forEach(e => E[e.key] = e); D.stories.forEach(s => S[s.key] = s);
  D.stories.forEach(s => s.tasks.forEach(t => T[t.key] = Object.assign({ story: s.key }, t)));
}
ingest();
const hrs = s => s.tasks.length ? s.tasks.reduce((a, t) => a + (t.h || 0), 0) : (s.own || 0);
let sel = ['S22','S23','S24','NEXT'], tab = 'map', stack = [], capSp = null, bdSp = 'S24', bdAsOf = '';
try { const x = JSON.parse(localStorage.getItem('sprintmap.sel') || 'null'); if (Array.isArray(x)) sel = x.filter(i => IDX[i] != null); } catch (e) {}
const selSorted = () => SP.filter(s => sel.includes(s.id));

function md(t) {
  let h = esc(String(t || '').replace(/<custom[^>]*>(https?:\/\/[^<\s]+)<\/custom>/g, '[Open link]($1)'));
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a class="link" target="_blank" rel="noopener" href="$2">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let out = '', ul = false;
  h.split('\n').forEach(l => {
    if (/^\s*[\*-]\s+/.test(l)) { if (!ul) { out += '<ul>'; ul = true; } out += '<li>' + l.replace(/^\s*[\*-]\s+/, '') + '</li>'; }
    else { if (ul) { out += '</ul>'; ul = false; } if (l.trim()) out += '<p>' + l + '</p>'; }
  });
  return out + (ul ? '</ul>' : '');
}
const who = a => `<span class="pill"><span class="av">${esc(ini(a))}</span>${esc(a || 'Unassigned')}</span>`;
const pts = s => s.sp != null ? s.sp + (s.sp === 1 ? ' pt' : ' pts') : '';

function storyCard(s) {
  return `<button class="card story" data-s="${esc(s.key)}" data-r="${esc(s.epic || 'none')}"><div class="k">${esc(s.key)}</div><div class="t">${esc(s.title)}</div>
    <div class="m">${who(s.a)}<span class="pill n">${f1(hrs(s))} h${s.sp != null ? ' · ' + pts(s) : ''}</span></div></button>`;
}
function rowsModel() {
  const win = selSorted(), ids = new Set(win.map(w => w.id));
  const rows = D.epics.map(e => ({ e, st: D.stories.filter(s => s.epic === e.key && ids.has(s.sprint)) }));
  const none = D.stories.filter(s => !D.epics.some(e => e.key === s.epic) && ids.has(s.sprint));
  const out = rows.filter(r => r.st.length);
  if (none.length) out.push({ e: null, st: none });
  return { win, out };
}
function epicCard(r) {
  if (!r.e) return `<div class="card epic" style="cursor:default" data-r="none"><div class="k">No epic</div><div class="t">User stories without an epic</div><div class="m"><span class="pill">${r.st.length} stories</span></div></div>`;
  const inF = r.st, h = inF.reduce((a, s) => a + hrs(s), 0), p = inF.reduce((a, s) => a + (s.sp || 0), 0);
  return `<button class="card epic" data-e="${esc(r.e.key)}" data-r="${esc(r.e.key)}"><div class="k">${esc(r.e.key)}</div><div class="t">${esc(r.e.title)}</div>
    <div class="m">${who(r.e.a)}<span class="pill n">${f1(h) + ' h' + (p ? ' · ' + p + ' pts' : '')}</span></div></button>`;
}
function renderMap() {
  const { win, out } = rowsModel();
  $('#map').style.setProperty('--n', Math.max(1, win.length));
  if (!out.length) { $('#map').innerHTML = '<div class="empty">' + (win.length ? 'No user stories in the selected sprints.' : 'Tick at least one sprint in the Sprints menu.') + '</div>'; $('#mlist').innerHTML = ''; return; }
  let h = '<svg id="lines"></svg><div></div>' + win.map(w => `<div class="colh">${esc(w.name)}<small>${esc(w.r)}</small></div>`).join('');
  out.forEach((r, i) => {
    h += `<div style="grid-row:${i + 2};grid-column:1">${epicCard(r)}</div>`;
    win.forEach((w, c) => {
      const ss = r.st.filter(s => s.sprint === w.id);
      h += `<div class="cell" style="grid-row:${i + 2};grid-column:${c + 2}">${ss.map(storyCard).join('')}</div>`;
    });
  });
  $('#map').innerHTML = h;
  $('#mlist').innerHTML = out.map(r => `<div class="ep">${epicCard(r)}${win.map(w => { const ss = r.st.filter(s => s.sprint === w.id); return ss.length ? `<div class="sp">${esc(w.name)}</div><div class="cell">${ss.map(storyCard).join('')}</div>` : ''; }).join('')}</div>`).join('');
  requestAnimationFrame(lines);
}
function lines() {
  const m = $('#map'), svg = $('#lines'); if (!svg || !m.offsetParent) return;
  const mr = m.getBoundingClientRect(); let d = '';
  const rect = el => { const r = el.getBoundingClientRect(); return { l: r.left - mr.left, r: r.right - mr.left, y: r.top - mr.top + r.height / 2 }; };
  const rowsSeen = {};
  m.querySelectorAll('[data-r]').forEach(el => (rowsSeen[el.dataset.r] = rowsSeen[el.dataset.r] || []).push(el));
  Object.values(rowsSeen).forEach(els => {
    const ep = els.find(e => e.classList.contains('epic')); if (!ep) return;
    const cards = els.filter(e => e.classList.contains('story'));
    const byCol = {}; cards.forEach(c => { const col = c.parentElement.style.gridColumn; (byCol[col] = byCol[col] || []).push(c); });
    const cols = Object.keys(byCol).sort((a, b) => a - b); let prev = [ep];
    cols.forEach(col => {
      byCol[col].forEach((c, i) => {
        const a = rect(prev[Math.min(i, prev.length - 1)]), b = rect(c), mx = (a.r + b.l) / 2;
        d += `<path data-a="${esc(c.dataset.s)}" d="M${a.r},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.l},${b.y}"/>`;
      });
      prev = byCol[col];
    });
  });
  svg.setAttribute('viewBox', `0 0 ${mr.width} ${mr.height}`); svg.innerHTML = d;
}
function renderCap() {
  const opts = selSorted().filter(s => s.id !== 'NEXT');
  if (!opts.length) { $('#v-cap').innerHTML = '<div class="note">Tick at least one sprint (other than Sprint 25 and backlog) in the Sprints menu.</div>'; return; }
  if (!capSp || !opts.some(o => o.id === capSp)) capSp = opts[opts.length - 1].id;
  const CAP = 64, sp = SP[IDX[capSp]];
  const by = {}; D.stories.filter(s => s.sprint === capSp).forEach(s => (s.tasks.length ? s.tasks : [{ a: s.a, h: s.own }]).forEach(t => by[t.a] = (by[t.a] || 0) + (t.h || 0)));

const tok = () => { try { return localStorage.getItem('sprintdash.gh') || ''; } catch (e) { return ''; } };
function panel(h) { rfp.innerHTML = h; rfp.hidden = !h; }
async function startRefresh() {
  const t = tok();
  if (!t) return panel(`<p><b>One-time setup.</b> Refreshing runs a GitHub job that pulls Jira. It needs a GitHub token with permission to run the job. The token stays in this browser only.</p>
    <p>1. <a target="_blank" rel="noopener" href="https://github.com/settings/personal-access-tokens/new">Create a fine-grained token</a>: repository access ${esc(REPO)}, permission Actions: Read and write.<br>2. Paste it here:</p>
    <p><input id="rftok" type="password" placeholder="github_pat_..." autocomplete="off"> <button class="chip" id="rfsave">Save and refresh</button></p>
    <p>No token? <a target="_blank" rel="noopener" href="https://github.com/${REPO}/actions/workflows/${WF}">Open the job page</a> and click Run workflow. The dashboard updates a few minutes later.</p>`);
  panel(''); rfb.disabled = true; rfb.textContent = 'Refreshing...';
  const before = META && META.refreshedAt;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WF}/dispatches`, { method: 'POST', headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: 'main' }) });
    if (r.status === 401 || r.status === 403 || r.status === 404) { try { localStorage.removeItem('sprintdash.gh'); } catch (e) {} rfb.disabled = false; rfb.textContent = 'Refresh data'; return panel('<p>GitHub refused the token. It needs access to ' + esc(REPO) + ' with Actions: Read and write, and you must be a collaborator. Click Refresh data to enter a new token.</p>'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (e) { rfb.disabled = false; rfb.textContent = 'Refresh data'; return panel('<p>Could not start the refresh (' + esc(e.message) + '). Try again, or <a target="_blank" rel="noopener" href="https://github.com/' + REPO + '/actions/workflows/' + WF + '">run it from GitHub</a>.</p>'); }
  rfs.textContent = 'Pulling from Jira. This takes about 2 to 4 minutes.';
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 10000));
    try { const m = await (await fetch('data/meta.json?v=' + Date.now(), { cache: 'no-store' })).json(); if (m.refreshedAt !== before) { await loadData(); rfb.disabled = false; rfb.textContent = 'Refresh data'; return; } } catch (e) {}
  }
  rfb.disabled = false; rfb.textContent = 'Refresh data'; rfs.textContent = 'Refresh is taking longer than expected. Reload the page in a few minutes.';
}
rfb.onclick = startRefresh;
rfp.addEventListener('click', e => { if (e.target.id === 'rfsave') { const v = $('#rftok').value.trim(); if (v) { try { localStorage.setItem('sprintdash.gh', v); } catch (x) {} startRefresh(); } } });
setInterval(() => { if (META) showMeta(); }, 60000);
showMeta();
show();
if (!D.stories.length) loadData().catch(() => { rfs.textContent = 'Could not load data files'; });
</script>
